spring.application.name=clostino
# H2データベースの設定
spring.datasource.url=jdbc:h2:mem:clostino
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2コンソールの有効化
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2コンソールのコンテナ外部からのアクセスを有効化
spring.h2.console.settings.web-allow-others=true

# JPAの設定
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# 初期データ投入の設定
spring.sql.init.mode=always

# メール送信（Mailtrap）の設定
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=<Mailtrap の username>
spring.mail.password=<Mailtrap の password>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Stripe の設定
stripe.api.key=sk_test_dummy
stripe.publishable.key=pk_test_dummy