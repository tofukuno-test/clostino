<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>ログイン - Clostino</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card">
            <div class="card-header">
              <h2 class="mb-0">ログイン</h2>
            </div>
            <div class="card-body">
              <!-- 会員登録完了後のメッセージ -->
              <div th:if="${message}" class="alert alert-success" role="alert">
                <span th:text="${message}"></span>
              </div>

              <!-- ログアウト完了メッセージ -->
              <!-- Spring Securityは /login?logout にリダイレクトするため ${param.logout} で検出 -->
              <div th:if="${param.logout}" class="alert alert-info" role="alert">
                ログアウトしました
              </div>

              <!-- ログイン失敗メッセージ -->
              <!-- Spring Securityは /login?error にリダイレクトするため ${param.error} で検出 -->
              <div th:if="${param.error}" class="alert alert-danger" role="alert">
                メールアドレスまたはパスワードが正しくありません
              </div>

              <!-- Spring Securityが POST /login を受け取る -->
              <!-- Thymeleaf の th:action により CSRF トークンが自動付与される -->
              <form th:action="@{/login}" method="post">
                <!-- メールアドレス（usernameParameter("email")に対応） -->
                <div class="mb-3">
                  <label for="email" class="form-label">メールアドレス</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required
                    autofocus
                  />
                </div>

                <!-- パスワード -->
                <div class="mb-3">
                  <label for="password" class="form-label">パスワード</label>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                  />
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" class="btn btn-primary">
                    ログイン
                  </button>
                </div>
              </form>

              <div class="mt-3 text-center">
                <p class="mb-0">
                  アカウントをお持ちでない方は
                  <a th:href="@{/register}">会員登録</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
