<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ご注文の確認 - Clostino</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-5">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/cart}">カート</a></li>
          <li class="breadcrumb-item">
            <a th:href="@{/checkout}">注文手続き</a>
          </li>
          <li class="breadcrumb-item active">ご注文の確認</li>
        </ol>
      </nav>

      <h1 class="section-title">
        <i class="bi bi-check2-square me-2"></i>ご注文の確認
      </h1>

      <p class="text-muted mb-4">
        注文内容をご確認のうえ、下のボタンからお支払いを完了してください。
      </p>

      <!-- エラーメッセージ（在庫不足など） -->
      <div
        th:if="${error}"
        class="alert alert-danger fade-in mb-4"
        role="alert"
      >
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}"></span>
      </div>

      <div class="row g-4">
        <!-- 注文内容 -->
        <div class="col-lg-8">
          <!-- お届け先 -->
          <div class="card mb-4">
            <div class="card-header">
              <h5 class="mb-0"><i class="bi bi-truck me-2"></i>お届け先</h5>
            </div>
            <div class="card-body">
              <p class="mb-1 fw-bold" th:text="${customerName}">お名前</p>
              <p class="mb-0 text-muted" th:text="${shippingAddress}">
                配送先住所
              </p>
            </div>
          </div>

          <!-- 注文商品 -->
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0"><i class="bi bi-bag me-2"></i>ご注文商品</h5>
            </div>
            <div class="card-body p-0">
              <table class="table cart-table mb-0">
                <thead>
                  <tr>
                    <th colspan="2">商品</th>
                    <th class="text-end">単価</th>
                    <th class="text-center">数量</th>
                    <th class="text-end">小計</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="item : ${cartItems}">
                    <td style="width: 80px;">
                      <img
                        th:src="${item.product.imageUrl != null ? item.product.imageUrl : 'https://placehold.jp/80x80.jpg/f5f7fa/6c757d?text=No+Image'}"
                        th:alt="${item.product.name}"
                        class="cart-item-image"
                      />
                    </td>
                    <td>
                      <a
                        th:href="@{/products/{id}(id=${item.product.id})}"
                        th:text="${item.product.name}"
                        class="cart-item-name"
                        >商品名</a
                      >
                    </td>
                    <td
                      class="text-end"
                      th:text="'¥' + ${#numbers.formatInteger(item.product.price, 1, 'COMMA')}"
                    >
                      ¥0
                    </td>
                    <td class="text-center" th:text="${item.quantity}">1</td>
                    <td
                      class="text-end fw-bold"
                      th:text="'¥' + ${#numbers.formatInteger(item.subtotal, 1, 'COMMA')}"
                    >
                      ¥0
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- 支払いサマリー -->
        <div class="col-lg-4">
          <div class="cart-summary">
            <h5 class="mb-4"><i class="bi bi-credit-card me-2"></i>お支払い</h5>

            <div class="cart-summary-item">
              <span class="text-muted">小計（税抜）</span>
              <span
                th:text="'¥' + ${#numbers.formatInteger(subtotal, 1, 'COMMA')}"
                >¥0</span
              >
            </div>
            <div class="cart-summary-item">
              <span class="text-muted">消費税（10%）</span>
              <span th:text="'¥' + ${#numbers.formatInteger(tax, 1, 'COMMA')}"
                >¥0</span
              >
            </div>
            <div class="cart-summary-item">
              <span class="text-muted">配送料</span>
              <span class="text-success">無料</span>
            </div>

            <div
              class="d-flex justify-content-between align-items-center mt-4 pt-3 mb-4"
            >
              <span class="fw-bold fs-5">お支払い金額</span>
              <span
                class="cart-total fs-5"
                th:text="'¥' + ${#numbers.formatInteger(total, 1, 'COMMA')}"
                >¥0</span
              >
            </div>

            <!-- 支払い方法（モック表示） -->
            <div class="alert alert-info mb-4">
              <i class="bi bi-info-circle me-2"></i>
              <strong>お支払い方法：</strong>クレジットカード（モック）
              <br />
              <small class="text-muted"
                >※
                本アプリでは実際の決済は行われません。学習用のシミュレーションです。</small
              >
            </div>

            <!-- 支払い完了ボタン -->
            <form
              id="paymentForm"
              th:action="@{/checkout/complete}"
              method="post"
              class="d-grid"
            >
              <button
                type="submit"
                class="btn btn-accent btn-lg"
                id="payButton"
              >
                <i class="bi bi-credit-card-2-front me-2"></i>お支払いを完了する
              </button>
              <small class="text-muted text-center mt-2">
                クリック後、決済処理のシミュレーション（約2秒）が行われます
              </small>
            </form>

            <a
              th:href="@{/checkout}"
              class="btn btn-outline-secondary w-100 mt-3"
            >
              <i class="bi bi-arrow-left me-1"></i>配送先を修正する
            </a>

            <!-- セキュリティ表示 -->
            <div class="mt-4 pt-3 border-top text-center">
              <small class="text-muted">
                <i class="bi bi-shield-lock me-1"></i>
                安全なお支払い
              </small>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
      document
        .getElementById("paymentForm")
        .addEventListener("submit", function (e) {
          const btn = document.getElementById("payButton");
          btn.disabled = true;
          btn.innerHTML =
            '<span class="spinner-border spinner-border-sm me-2" role="status"></span>決済処理中...';
        });
    </script>
  </body>
</html>
