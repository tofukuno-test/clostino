<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文詳細 - Clostino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/products}">商品一覧</a></li>
                <li class="breadcrumb-item"><a th:href="@{/orders}">注文履歴</a></li>
                <li class="breadcrumb-item active">注文 #<span th:text="${order.id}">1</span></li>
            </ol>
        </nav>

        <h1 class="mb-4">注文詳細 #<span th:text="${order.id}">1</span></h1>

        <div class="card mb-4">
            <div class="card-header">注文情報</div>
            <div class="card-body">
                <table class="table table-borderless mb-0">
                    <tr>
                        <th style="width: 20%;">注文日時</th>
                        <td th:text="${#temporals.format(order.orderDateTime, 'yyyy/MM/dd HH:mm')}">2024/01/15 10:30</td>
                    </tr>
                    <tr>
                        <th>お客様名</th>
                        <td th:text="${order.customerName}">山田太郎</td>
                    </tr>
                    <tr>
                        <th>配送先</th>
                        <td th:text="${order.shippingAddress}">東京都...</td>
                    </tr>
                    <tr>
                        <th>ステータス</th>
                        <td th:text="${order.status}">PENDING</td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-header">注文明細</div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th>商品名</th>
                            <th class="text-end">単価（税抜）</th>
                            <th class="text-center">数量</th>
                            <th class="text-end">小計</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td>
                                <a th:href="@{/products/{id}(id=${item.product.id})}" th:text="${item.product.name}">商品名</a>
                            </td>
                            <td class="text-end" th:text="'¥' + ${#numbers.formatInteger(item.product.price, 1, 'COMMA')}">0</td>
                            <td class="text-center" th:text="${item.quantity}">1</td>
                            <td class="text-end" th:text="'¥' + ${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')}">0</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3" class="text-end">合計（税抜）</th>
                            <th class="text-end" th:text="'¥' + ${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 0, 'POINT')}">0</th>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <a th:href="@{/orders}" class="btn btn-outline-secondary">← 注文履歴に戻る</a>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
