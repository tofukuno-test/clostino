<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品一覧 - Clostino</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- LiveReload用のスクリプトを追加 -->
  <script src="http://localhost:35729/livereload.js"
    th:if="${@environment.getProperty('spring.devtools.livereload.enabled')}"></script>
  <!-- カスタムCSS -->
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
  <!-- ヘッダーの読み込み -->
  <header th:replace="~{fragments/header :: header}"></header>

  <!-- メインコンテンツ -->
  <main class="container">
    <h1 class="mb-4">商品一覧</h1>

    <!-- 検索フォーム -->
    <form th:action="@{/products}" method="get" class="mb-4">
      <div class="row g-2">
        <div class="col-md-8">
          <input
            type="text"
            name="keyword"
            class="form-control"
            placeholder="商品名で検索..."
            th:value="${keyword}"
          />
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-primary w-100">検索</button>
        </div>
        <div class="col-md-2">
        <a th:href="@{/products(keyword='')}" class="btn btn-outline-secondary w-100">クリア</a>        
      </div>
      </div>
    </form>

    <!-- 検索結果のメッセージ -->
    <div
      th:if="${keyword != null and !keyword.isEmpty()}"
      class="alert alert-info"
    >
      「<span th:text="${keyword}">キーワード</span>」の検索結果。
      <span th:text="${page.totalElements}">0</span>件
    </div>

    <!-- 商品一覧 -->
    <div class="row">
      <div th:each="product : ${products}" class="col-md-4 mb-4">
        <div class="card h-100">
          <!-- 画像をリンクに変更 -->
          <a th:href="@{/products/{id}(id=${product.id})}">
            <img th:src="${product.imageUrl}" src="https://placehold.jp/300x200.jpg" class="card-img-top" th:alt="${product.name}" />
          </a>
          <div class="card-body">
            <!-- 商品名をリンクに変更 -->
            <h5 class="card-title">
              <a th:href="@{/products/{id}(id=${product.id})}" class="text-decoration-none text-dark" th:text="${product.name}">商品名</a>
            </h5>
            <p class="card-text text-danger fw-bold">
              ¥<span th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')}">0
              </span>
            </p>
            <p class="card-text text-muted" th:text="${product.description}">
              商品説明
            </p>
            <span th:if="${product.stock > 0}" class="badge bg-success mb-2">在庫あり
            </span>
            <span th:unless="${product.stock > 0}" class="badge bg-danger mb-2">売り切れ
            </span>
          </div>
          <div class="card-footer bg-white border-top-0">
            <a th:if="${product.stock > 0}" th:href="@{/products/{id}(id=${product.id})}"
              class="btn btn-primary w-100">詳細を見る
            </a>
            <button th:unless="${product.stock > 0}" class="btn btn-secondary w-100" disabled>
              売り切れ
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 検索結果が0件の場合 -->
    <div th:if="${products.isEmpty()}" class="text-center py-5">
      <p class="text-muted">該当する商品が見つかりませんでした。</p>
    </div>

    <!-- ページネーション -->
    <nav aria-label="ページナビゲーション" class="mt-4" th:if="${page.totalPages > 1}">
      <ul class="pagination justify-content-center">
        <!-- 前のページへ -->
        <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
          <a class="page-link"
             th:href="@{/products(page=${page.number - 1}, keyword=${keyword})}"
             th:if="${page.hasPrevious()}">
            &laquo;
          </a>
          <span class="page-link" th:unless="${page.hasPrevious()}">&laquo;</span>
        </li>

        <!-- ページ番号 -->
        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
          <a class="page-link"
             th:href="@{/products(page=${i}, keyword=${keyword})}"
             th:text="${i + 1}"
             th:if="${i != page.number}">1</a>
          <span class="page-link"
                th:text="${i + 1}"
                th:if="${i == page.number}">1</span>
        </li>

        <!-- 次のページへ -->
        <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
          <a class="page-link"
             th:href="@{/products(page=${page.number + 1}, keyword=${keyword})}"
             th:if="${page.hasNext()}">
            &raquo;
          </a>
          <span class="page-link" th:unless="${page.hasNext()}">&raquo;</span>
        </li>
      </ul>
    </nav>

    <!-- ページ情報の表示 -->
    <div class="text-center text-muted mt-2 mb-4" th:if="${page.totalElements > 0}">
      <span th:text="${page.totalElements}">100</span>件中
      <span th:text="${page.number * page.size + 1}">1</span>-<span th:text="${page.number * page.size + page.numberOfElements}">12</span>件を表示
    </div>
  </main>

  <!-- フッターの読み込み -->
  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
