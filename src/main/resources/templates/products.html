<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品一覧 - Clostino</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- LiveReload用のスクリプトを追加 -->
  <script src="http://localhost:35729/livereload.js"
    th:if="${@environment.getProperty('spring.devtools.livereload.enabled')}"></script>
  <!-- カスタムCSS -->
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
  <!-- ヘッダーの読み込み -->
  <header th:replace="~{fragments/header :: header}"></header>

  <!-- メインコンテンツ -->
  <main class="container">
    <h1 class="mb-4">商品一覧</h1>

    <div class="row">
      <div th:each="product : ${products}" class="col-md-4 mb-4">
        <div class="card h-100">
          <!-- 画像をリンクに変更 -->
          <a th:href="@{/products/{id}(id=${product.id})}">
            <img th:src="${product.imageUrl}" src="https://placehold.jp/300x200.jpg" class="card-img-top" th:alt="${product.name}" />
          </a>
          <div class="card-body">
            <!-- 商品名をリンクに変更 -->
            <h5 class="card-title">
              <a th:href="@{/products/{id}(id=${product.id})}" class="text-decoration-none text-dark" th:text="${product.name}">商品名</a>
            </h5>
            <p class="card-text text-danger fw-bold">
              ¥<span th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')}">0
              </span>
            </p>
            <p class="card-text text-muted" th:text="${product.description}">
              商品説明
            </p>
            <span th:if="${product.stock > 0}" class="badge bg-success mb-2">在庫あり
            </span>
            <span th:unless="${product.stock > 0}" class="badge bg-danger mb-2">売り切れ
            </span>
          </div>
          <div class="card-footer bg-white border-top-0">
            <a th:if="${product.stock > 0}" th:href="@{/products/{id}(id=${product.id})}"
              class="btn btn-primary w-100">詳細を見る
            </a>
            <button th:unless="${product.stock > 0}" class="btn btn-secondary w-100" disabled>
              売り切れ
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- フッターの読み込み -->
  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
