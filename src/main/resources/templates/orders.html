<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注文履歴 - Clostino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5">
        <h1 class="mb-4">注文履歴</h1>

        <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
            注文はまだありません。
            <a th:href="@{/products}" class="alert-link">商品一覧</a>からお買い物を始めてください。
        </div>

        <div th:unless="${#lists.isEmpty(orders)}">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>注文ID</th>
                        <th>注文日時</th>
                        <th>お客様名</th>
                        <th class="text-end">合計金額（税抜）</th>
                        <th>ステータス</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.id}">1</td>
                        <td th:text="${#temporals.format(order.orderDateTime, 'yyyy/MM/dd HH:mm')}">2024/01/15 10:30</td>
                        <td th:text="${order.customerName}">山田太郎</td>
                        <td class="text-end" th:text="'¥' + ${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 0, 'POINT')}">0</td>
                        <td th:text="${order.status}">PENDING</td>
                        <td>
                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">詳細</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="mt-3">
            <a th:href="@{/products}" class="btn btn-outline-secondary">商品一覧に戻る</a>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
