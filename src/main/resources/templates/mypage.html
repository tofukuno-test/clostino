<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ - Clostino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5">
        <h1 class="mb-4">マイページ</h1>

        <!-- 成功メッセージ -->
        <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <!-- 会員情報カード -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0">会員情報</h2>
                        <a th:href="@{/mypage/edit}" class="btn btn-sm btn-outline-primary">編集</a>
                    </div>
                    <div class="card-body">
                        <table class="table table-borderless mb-0">
                            <tr>
                                <th scope="row" style="width: 30%;">お名前</th>
                                <td th:text="${user.name}"></td>
                            </tr>
                            <tr>
                                <th scope="row">メールアドレス</th>
                                <td th:text="${user.email}"></td>
                            </tr>
                            <tr>
                                <th scope="row">お届け先住所</th>
                                <td th:text="${user.address != null ? user.address : '未設定'}"></td>
                            </tr>
                            <tr>
                                <th scope="row">登録日</th>
                                <td th:text="${#temporals.format(user.createdAt, 'yyyy年MM月dd日')}"></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>

            <!-- クイックリンクカード -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h2 class="h5 mb-0">メニュー</h2>
                    </div>
                    <div class="card-body">
                        <div class="list-group list-group-flush">
                            <a th:href="@{/products}" class="list-group-item list-group-item-action">
                                商品一覧を見る
                            </a>
                            <a th:href="@{/cart}" class="list-group-item list-group-item-action">
                                カートを見る
                            </a>
                            <a th:href="@{/orders}" class="list-group-item list-group-item-action">
                                注文履歴
                            </a>
                            <a th:href="@{/mypage/edit}" class="list-group-item list-group-item-action">
                                会員情報を編集する
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
