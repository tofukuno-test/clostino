<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ページが見つかりません - Clostino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <style>
        .error-container {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <!-- ヘッダー（共通テンプレートから読み込む場合） -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container error-container">
        <div class="text-center">
            <div class="error-code">404</div>
            <h1 class="mt-3">お探しのページが見つかりません</h1>
            <p class="text-muted mt-3">
                申し訳ありませんが、リクエストされたページは存在しないか、<br>
                移動または削除された可能性があります。
            </p>
            <div class="mt-4">
                <a th:href="@{/}" class="btn btn-primary me-2">
                    トップページへ
                </a>
                <a th:href="@{/products}" class="btn btn-outline-secondary">
                    商品一覧へ
                </a>
            </div>
        </div>
    </div>

    <!-- フッター（共通テンプレートから読み込む場合） -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
