<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${product.name} + ' | Clostino'">商品詳細 | Clostino</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container my-5">
      <!-- パンくずリスト -->
      <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
          <li class="breadcrumb-item">
            <a th:href="@{/products}">商品一覧</a>
          </li>
          <li class="breadcrumb-item active" th:text="${product.name}">
            商品名
          </li>
        </ol>
      </nav>

      <div class="row">
        <!-- 商品画像 -->
        <div class="col-md-6">
          <img
            th:src="${product.imageUrl}"
            th:alt="${product.name}"
            class="img-fluid rounded"
          />
        </div>

        <!-- 商品情報 -->
        <div class="col-md-6">
          <h1 class="mb-3" th:text="${product.name}">商品名</h1>

          <p class="h3 text-primary mb-4">
            <span th:text="${#numbers.formatInteger(product.price, 1, 'COMMA')}"
              >1,000</span
            >円（税込）
          </p>

          <div class="mb-4">
            <h5>商品説明</h5>
            <p th:text="${product.description}">
              商品の説明文がここに入ります。
            </p>
          </div>

          <div class="mb-4">
            <span
              class="badge"
              th:classappend="${product.stock > 0} ? 'bg-success' : 'bg-danger'"
              th:text="${product.stock > 0} ? '在庫あり（' + ${product.stock} + '個）' : '在庫なし'"
            >
              在庫状況
            </span>
          </div>

          <!-- ボタン -->
          <div class="d-grid gap-2">
            <button
              type="button"
              class="btn btn-primary btn-lg"
              th:disabled="${product.stock == 0}"
            >
              カートに入れる
            </button>
            <a th:href="@{/products}" class="btn btn-outline-secondary">
              一覧に戻る
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
