<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会員登録 - Clostino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="mb-0">会員登録</h2>
                    </div>
                    <div class="card-body">
                        <!-- エラーメッセージ表示 -->
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/register}" th:object="${userForm}" method="post">
                            <!-- 名前 -->
                            <div class="mb-3">
                                <label for="name" class="form-label">お名前 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="name" th:field="*{name}"
                                    th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                </div>
                            </div>

                            <!-- メールアドレス -->
                            <div class="mb-3">
                                <label for="email" class="form-label">メールアドレス <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" th:field="*{email}"
                                    th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                    th:errors="*{email}"></div>
                            </div>

                            <!-- パスワード -->
                            <div class="mb-3">
                                <label for="password" class="form-label">パスワード <span
                                        class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" th:field="*{password}"
                                    th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}"></div>
                                <div class="form-text">8文字以上で入力してください</div>
                            </div>

                            <!-- パスワード確認 -->
                            <div class="mb-3">
                                <label for="passwordConfirm" class="form-label">パスワード（確認） <span
                                        class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="passwordConfirm"
                                    th:field="*{passwordConfirm}"
                                    th:classappend="${#fields.hasErrors('passwordConfirm')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('passwordConfirm')}"
                                    th:errors="*{passwordConfirm}"></div>
                            </div>

                            <!-- 住所（任意） -->
                            <div class="mb-3">
                                <label for="address" class="form-label">お届け先住所</label>
                                <input type="text" class="form-control" id="address" th:field="*{address}">
                                <div class="form-text">後から設定することもできます</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">登録する</button>
                            </div>
                        </form>

                        <div class="mt-3 text-center">
                            <p class="mb-0">
                                既にアカウントをお持ちの方は
                                <a th:href="@{/login}">ログイン</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
