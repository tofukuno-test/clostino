<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カート - Clostino</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <!-- ヘッダー -->
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-4">
      <h1 class="mb-4">ショッピングカート</h1>

      <!-- フラッシュメッセージ -->
      <div
        th:if="${message}"
        class="alert alert-success"
        role="alert"
        th:text="${message}"
      ></div>
      <div
        th:if="${error}"
        class="alert alert-danger"
        role="alert"
        th:text="${error}"
      ></div>

      <!-- カートが空の場合 -->
      <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
        カートに商品はありません。
        <a th:href="@{/products}" class="alert-link">商品一覧</a
        >からお買い物を続けてください。
      </div>

      <!-- カート一覧 -->
      <div th:unless="${#lists.isEmpty(cartItems)}">
        <table class="table table-striped align-middle">
          <thead>
            <tr>
              <th>商品名</th>
              <th class="text-end">単価（税抜）</th>
              <th class="text-center">数量</th>
              <th class="text-end">小計</th>
              <th class="text-center">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${cartItems}">
              <td>
                <a
                  th:href="@{/products/{id}(id=${item.product.id})}"
                  th:text="${item.product.name}"
                  >商品名</a
                >
              </td>
              <td
                class="text-end"
                th:text="'¥' + ${#numbers.formatInteger(item.product.price, 1, 'COMMA')}"
              >
                0
              </td>
              <td class="text-center">
                <!-- 数量バッジ（クリックで編集ポップアップを開く） -->
                <span
                  class="qty-display"
                  th:text="${item.quantity}"
                  th:data-product-id="${item.product.id}"
                  th:data-stock="${item.product.stock}"
                  th:data-quantity="${item.quantity}"
                  title="クリックして数量を変更"
                ></span>
              </td>
              <td
                class="text-end"
                th:text="'¥' + ${#numbers.formatInteger(item.subtotal, 1, 'COMMA')}"
              >
                0
              </td>
              <td class="text-center">
                <form th:action="@{/cart/remove}" method="post">
                  <input
                    type="hidden"
                    name="productId"
                    th:value="${item.product.id}"
                  />
                  <button type="submit" class="btn btn-sm btn-outline-danger">
                    削除
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <th colspan="3" class="text-end">合計（税抜）</th>
              <th
                class="text-end"
                th:text="'¥' + ${#numbers.formatInteger(total, 1, 'COMMA')}"
              >
                0
              </th>
              <td></td>
            </tr>
          </tfoot>
        </table>

        <div class="d-flex gap-2 mt-3">
          <form th:action="@{/cart/clear}" method="post" class="me-2">
            <button type="submit" class="btn btn-outline-danger">
              カートを空にする
            </button>
          </form>
          <a th:href="@{/products}" class="btn btn-outline-secondary"
            >買い物を続ける</a
          >
        </div>
      </div>
    </div>

    <!-- 数量編集ポップアップ（body直下・position:fixedで表示） -->
    <!-- th:action で Thymeleaf が CSRF トークンを自動付与するため、ここで宣言する -->
    <div id="qty-popup">
      <form id="qty-popup-form" th:action="@{/cart/update}" method="post">
        <input type="hidden" name="productId" id="qty-popup-product-id" />
        <div class="qty-popup-controls">
          <button
            type="button"
            id="qty-popup-decrease"
            class="btn btn-sm btn-outline-secondary"
            tabindex="-1"
          >
            -
          </button>
          <input
            type="number"
            id="qty-popup-input"
            name="quantity"
            class="form-control form-control-sm text-center"
            min="1"
          />
          <button
            type="button"
            id="qty-popup-increase"
            class="btn btn-sm btn-outline-secondary"
            tabindex="-1"
          >
            +
          </button>
          <button
            type="submit"
            class="btn btn-sm btn-primary"
            title="確定 (Enter)"
          >
            ✓
          </button>
        </div>
        <div class="qty-popup-hint">Enter で確定 / Esc でキャンセル</div>
      </form>
    </div>

    <!-- フッター -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function () {
        var popup = document.getElementById("qty-popup");
        var popupForm = document.getElementById("qty-popup-form");
        var popupProdId = document.getElementById("qty-popup-product-id");
        var popupInput = document.getElementById("qty-popup-input");
        var popupDec = document.getElementById("qty-popup-decrease");
        var popupInc = document.getElementById("qty-popup-increase");
        var activeDisplay = null;

        /* 入力欄の幅を桁数に合わせて更新 */
        function updateInputWidth() {
          var len = String(popupInput.value || "0").length;
          popupInput.style.width = Math.max(len, 2) + "ch";
        }

        /* ポップアップを開く */
        function openPopup(display) {
          activeDisplay = display;
          popupProdId.value = display.dataset.productId;
          popupInput.value = display.dataset.quantity;
          popupInput.max = display.dataset.stock || 999;
          updateInputWidth();

          /* 数量バッジの位置を基準に、viewport 固定で表示 */
          popup.style.visibility = "hidden";
          popup.style.display = "block";
          var rect = display.getBoundingClientRect();
          var popW = popup.offsetWidth;
          var left = rect.left + rect.width / 2 - popW / 2;
          left = Math.max(8, Math.min(left, window.innerWidth - popW - 8));
          var top = rect.bottom + 6;
          if (top + popup.offsetHeight > window.innerHeight - 8) {
            top = rect.top - popup.offsetHeight - 6;
          }
          popup.style.left = left + "px";
          popup.style.top = top + "px";
          popup.style.visibility = "";

          popupInput.select();
          popupInput.focus();
        }

        /* ポップアップを閉じる（キャンセル） */
        function closePopup() {
          popup.style.display = "none";
          activeDisplay = null;
        }

        /* 数量バッジをクリック → ポップアップを開く */
        document.querySelectorAll(".qty-display").forEach(function (display) {
          display.addEventListener("click", function (e) {
            e.stopPropagation();
            if (popup.style.display === "block") {
              closePopup();
            }
            openPopup(display);
          });
        });

        /* +/- ボタン */
        popupDec.addEventListener("click", function () {
          var val = parseInt(popupInput.value) || 1;
          if (val > 1) {
            popupInput.value = val - 1;
            updateInputWidth();
          }
        });
        popupInc.addEventListener("click", function () {
          var val = parseInt(popupInput.value) || 1;
          var max = parseInt(popupInput.max) || 999;
          if (val < max) {
            popupInput.value = val + 1;
            updateInputWidth();
          }
        });
        popupInput.addEventListener("input", updateInputWidth);

        /* Enter キーで確定 / Escape でキャンセル */
        popupInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            popupForm.requestSubmit();
          }
          if (e.key === "Escape") {
            closePopup();
          }
        });

        /* ポップアップ内クリックは外クリック判定に含めない */
        popup.addEventListener("click", function (e) {
          e.stopPropagation();
        });

        /* 外クリック・スクロール・リサイズでキャンセル */
        document.addEventListener("click", function () {
          if (popup.style.display === "block") {
            closePopup();
          }
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && popup.style.display === "block") {
            closePopup();
          }
        });
        window.addEventListener("scroll", closePopup, { passive: true });
        window.addEventListener("resize", closePopup);
      })();
    </script>
  </body>
</html>
