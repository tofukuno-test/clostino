<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注文手続き - Clostino</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <!-- Stripe.js を読み込む（常に stripe.com から読み込むこと） -->
    <script src="https://js.stripe.com/v3/"></script>
  </head>
  <body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container py-5">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a th:href="@{/cart}">カート</a></li>
          <li class="breadcrumb-item active">注文手続き</li>
        </ol>
      </nav>

      <h1 class="section-title">
        <i class="bi bi-credit-card me-2"></i>注文手続き
      </h1>

      <div th:if="${error}" class="alert alert-danger fade-in" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${error}"></span>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <!-- 配送先入力 -->
          <div class="card mb-4">
            <div class="card-header">
              <h5 class="mb-0"><i class="bi bi-truck me-2"></i>お届け先住所</h5>
            </div>
            <div class="card-body">
              <form
                id="checkoutForm"
                th:action="@{/checkout}"
                th:object="${checkoutForm}"
                method="post"
              >
                <div class="mb-3">
                  <label for="shippingAddress" class="form-label"
                    >配送先住所 <span class="text-danger">*</span></label
                  >
                  <textarea
                    class="form-control"
                    id="shippingAddress"
                    th:field="*{shippingAddress}"
                    rows="3"
                    placeholder="例：〒100-0001 東京都千代田区千代田1-1"
                    th:classappend="${#fields.hasErrors('shippingAddress')} ? 'is-invalid' : ''"
                  ></textarea>
                  <div
                    class="invalid-feedback"
                    th:if="${#fields.hasErrors('shippingAddress')}"
                    th:errors="*{shippingAddress}"
                  ></div>
                </div>

                <!-- Stripe Elements のカード入力欄 -->
                <div class="mb-3">
                  <label class="form-label">クレジットカード情報</label>
                  <div
                    id="card-element"
                    class="form-control"
                    style="height: 2.6rem; padding-top: 0.65rem;"
                  ></div>
                  <div id="card-errors" class="text-danger mt-1 small"></div>
                  <small class="text-muted">
                    テスト用カード番号: 4242 4242 4242 4242 / 有効期限: 12/34 / CVC: 123
                  </small>
                </div>

                <!-- PaymentMethod ID をサーバーへ送るための隠しフィールド -->
                <input type="hidden" id="paymentMethodId" name="paymentMethodId" />

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-accent" id="submitBtn">
                    <i class="bi bi-arrow-right-circle me-2"></i>確認画面へ進む
                  </button>
                  <a th:href="@{/cart}" class="btn btn-outline-secondary"
                    >カートに戻る</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="cart-summary">
            <h5 class="mb-4"><i class="bi bi-receipt me-2"></i>注文内容</h5>
            <div class="cart-summary-item">
              <span class="text-muted">小計（税抜）</span>
              <span
                th:text="'¥' + ${#numbers.formatInteger(subtotal, 1, 'COMMA')}"
                >¥0</span
              >
            </div>
            <div class="cart-summary-item">
              <span class="text-muted">消費税（10%）</span>
              <span th:text="'¥' + ${#numbers.formatInteger(tax, 1, 'COMMA')}"
                >¥0</span
              >
            </div>
            <div
              class="d-flex justify-content-between align-items-center mt-4 pt-3"
            >
              <span class="fw-bold">合計（税込）</span>
              <span
                class="cart-total"
                th:text="'¥' + ${#numbers.formatInteger(total, 1, 'COMMA')}"
                >¥0</span
              >
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
      // Stripe 公開可能キーで初期化する
      const stripe = Stripe([[${publishableKey}]]);
      const elements = stripe.elements();

      // カード入力 UI を #card-element に描画する
      const cardElement = elements.create('card', {
        style: {
          base: { fontSize: '16px', color: '#212529' },
          invalid: { color: '#dc3545' }
        }
      });
      cardElement.mount('#card-element');

      // リアルタイムバリデーションエラーを表示する
      cardElement.on('change', function (event) {
        const displayError = document.getElementById('card-errors');
        displayError.textContent = event.error ? event.error.message : '';
      });

      // フォーム送信時にカード情報をトークン化する
      const form = document.getElementById('checkoutForm');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = '処理中...';

        const { paymentMethod, error } = await stripe.createPaymentMethod({
          type: 'card',
          card: cardElement
        });

        if (error) {
          document.getElementById('card-errors').textContent = error.message;
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="bi bi-arrow-right-circle me-2"></i>確認画面へ進む';
        } else {
          // PaymentMethod ID を隠しフィールドにセットしてフォームを送信する
          document.getElementById('paymentMethodId').value = paymentMethod.id;
          form.submit();
        }
      });
    </script>
  </body>
</html>
